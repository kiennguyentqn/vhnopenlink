<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Lấy link SSK từ link TikTok</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --text: #111;
        --muted: #666;
        --accent1: #25f4ee;
        --accent2: #ff2c55;
        --border: #e2e2e6;
        --ok-bg: #e8fbf9;
        --ok-text: #0c8a82;
        --err-bg: #fff0f2;
        --err-text: #c81d3f;
        --warn-bg: #fff7e8;
        --warn-text: #a85e00;
        --load-bg: #f1f1f3;
        --load-text: #666;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0a0a0a;
          --card: #141416;
          --text: #f2f2f2;
          --muted: #999;
          --border: #2a2a2e;
          --ok-bg: #0c2524;
          --ok-text: #25f4ee;
          --err-bg: #2a0f14;
          --err-text: #ff667f;
          --warn-bg: #2a2110;
          --warn-text: #ffb347;
          --load-bg: #1c1c1e;
          --load-text: #999;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0a0a0a;
        --card: #141416;
        --text: #f2f2f2;
        --muted: #999;
        --border: #2a2a2e;
        --ok-bg: #0c2524;
        --ok-text: #25f4ee;
        --err-bg: #2a0f14;
        --err-text: #ff667f;
        --warn-bg: #2a2110;
        --warn-text: #ffb347;
        --load-bg: #1c1c1e;
        --load-text: #999;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 16px;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 19px;
        margin: 0 0 4px;
        background: linear-gradient(90deg, var(--accent1), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p.sub {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
      }
      textarea {
        width: 100%;
        min-height: 80px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: 14px;
        resize: vertical;
        font-family: inherit;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, var(--accent1), #1677ff);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button:active {
        transform: scale(0.98);
      }
      .result {
        margin-top: 16px;
        padding: 14px;
        border-radius: 12px;
        font-size: 13px;
        word-break: break-all;
        display: none;
      }
      .result.ok {
        display: block;
        background: var(--ok-bg);
        color: var(--ok-text);
        border: 1px solid var(--ok-text);
      }
      .result.err {
        display: block;
        background: var(--err-bg);
        color: var(--err-text);
        border: 1px solid var(--err-text);
      }
      .result.warn {
        display: block;
        background: var(--warn-bg);
        color: var(--warn-text);
        border: 1px solid var(--warn-text);
      }
      .result.loading {
        display: block;
        background: var(--load-bg);
        color: var(--load-text);
        border: 1px solid var(--border);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .row code {
        flex: 1 1 auto;
        min-width: 0;
        overflow-wrap: break-word;
        word-break: break-word;
        font-family: monospace;
        font-size: 12.5px;
      }
      .copybtn {
        flex-shrink: 0;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 700;
        background: var(--accent2);
        color: #fff;
        cursor: pointer;
        margin: 0;
        width: auto;
      }
      .label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 10px;
      }
      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .title-row h1 {
        margin: 0;
      }
      .expiry-badge {
        font-size: 11px;
        font-weight: 800;
        color: var(--accent2);
        white-space: nowrap;
      }
      .device-line {
        margin-top: 14px;
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title-row">
        <h1>Lấy link SSK</h1>
        <span class="expiry-badge" id="deviceExpiryShown"
          >Hạn dùng: đang lấy...</span
        >
      </div>
      <p class="sub">
        Dán link TikTok Live, hoặc link có tham số ?r= (mã hóa phía máy chủ), để
        lấy link mở app.
      </p>
      <textarea
        id="input"
        placeholder="https://www.tiktok.com/@abc/live?room_id=712345...
hoặc
https://domain/r/VHN1.html?r=DVvg68eutKaf..."
      ></textarea>
      <label
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-top: 10px;
          font-size: 13px;
          color: var(--muted);
        "
      >
        <input
          type="checkbox"
          id="autoOpen"
          checked
          style="width: 16px; height: 16px"
        />
        Tự động mở app khi có kết quả
      </label>
      <div id="result" class="result"></div>
      <div class="device-line">
        Mã thiết bị: <span id="deviceIdShown"></span>
      </div>
    </div>
    <script>
      // ===== API Apps Script dùng để giải mã r= và kiểm tra thiết bị =====
      // Phải khớp với API_URL mà trang xác minh thiết bị (bản gốc) đang dùng,
      // vì bây giờ việc giải mã + duyệt thiết bị nằm ở server, không còn ở client nữa.
      const API_URL =
        "https://script.google.com/macros/s/AKfycbwW7UiNjh29WsXs0Sa225vXc1IajocS9hMKSy8dVKa1Fz-hwxym-lvaqooFy9m-KmcH/exec";
      const API_TIMEOUT_MS = 10000;

      // ---- Device id: lấy từ Google Sheet "key2" (mã có hạn dùng xa nhất),
      // thay vì tự sinh ngẫu nhiên. Nếu mã lấy được đã hết hạn so với hiện tại,
      // tự động chờ rồi gọi lại đến khi lấy được mã còn hạn. ----
      const DEVICE_SHEET_ID = "1-e7G6GYM9eJSKOF1AOdATM4H2X-7erAaqj0VJUCD6T8";
      const DEVICE_SHEET_NAME = "key2";
      const DEVICE_RETRY_MS = 5000; // chờ 5s rồi thử lại nếu chưa có mã hợp lệ

      function parseCSVLine(line) {
        const result = [];
        let current = "",
          inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else inQuotes = !inQuotes;
          } else if (c === "," && !inQuotes) {
            result.push(current);
            current = "";
          } else current += c;
        }
        result.push(current);
        return result;
      }

      function parseExpiry(value) {
        if (!value) return null;
        const text = String(value).trim();
        if (!text) return null;
        function createVNDate(y, m, d, h, mi, s) {
          h = h || 0;
          mi = mi || 0;
          s = s || 0;
          return new Date(Date.UTC(y, m, d, h - 7, mi, s, 0));
        }
        let m = text.match(
          /^(\d{1,2}):(\d{2})\s+(\d{1,2})\/(\d{1,2})\/(\d{4})$/,
        );
        if (m) return createVNDate(+m[5], +m[4] - 1, +m[3], +m[1], +m[2]);
        m = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})$/);
        if (m) return createVNDate(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]);
        m = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (m) return createVNDate(+m[3], +m[2] - 1, +m[1], 23, 59, 59);
        const native = new Date(text);
        return isNaN(native.getTime()) ? null : native;
      }

      async function fetchBestDeviceFromSheet() {
        const url =
          "https://docs.google.com/spreadsheets/d/" +
          DEVICE_SHEET_ID +
          "/gviz/tq?tqx=out:csv&sheet=" +
          DEVICE_SHEET_NAME +
          "&t=" +
          Date.now();
        const res = await fetch(url, { cache: "no-store" });
        const text = await res.text();
        const lines = text.trim().split(/\r?\n/);

        let best = null;
        let bestDate = null;
        for (let i = 1; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i]);
          const device = (cols[0] || "").trim();
          const expiryStr = (cols[2] || "").trim();
          if (!device) continue;
          const expiryDate = parseExpiry(expiryStr);
          if (!expiryDate) continue;
          if (!bestDate || expiryDate.getTime() > bestDate.getTime()) {
            bestDate = expiryDate;
            best = { device, note: cols[1], expiry: expiryStr, id: cols[3] };
          }
        }
        return { best, bestDate };
      }

      async function loadDeviceId() {
        // Nếu đã có mã lưu từ lần trước và mã đó còn hạn thì dùng luôn,
        // không cần gọi sheet lấy mã khác, không cần chờ gì cả.
        const cachedId = localStorage.getItem("tnam_device_id");
        const cachedExpiryMs = Number(
          localStorage.getItem("tnam_device_expiry"),
        );
        if (cachedId && cachedExpiryMs && cachedExpiryMs > Date.now()) {
          console.log("Mã đã lưu vẫn còn hạn, dùng luôn:", cachedId);
          return cachedId;
        }

        const { best, bestDate } = await fetchBestDeviceFromSheet();

        if (best) {
          console.log("Đã lấy mã có hạn xa nhất:", best.device);
          console.log("Hạn dùng:", best.expiry);

          const now = new Date();
          if (bestDate.getTime() <= now.getTime()) {
            // Hạn dùng của mã tốt nhất tìm được đã hết hạn -> chưa lưu mã này,
            // chờ rồi gọi lại đoạn lấy mã này đến khi có mã còn hạn.
            console.log(
              "Hạn dùng đã hết hạn, thử lại sau " +
                DEVICE_RETRY_MS / 1000 +
                "s...",
            );
            await new Promise((r) => setTimeout(r, DEVICE_RETRY_MS));
            return loadDeviceId();
          }

          localStorage.setItem("tnam_device_id", best.device);
          localStorage.setItem(
            "tnam_device_expiry",
            String(bestDate.getTime()),
          );
          return best.device;
        }

        console.log(
          "Không tìm thấy dòng hợp lệ, thử lại sau " +
            DEVICE_RETRY_MS / 1000 +
            "s...",
        );
        await new Promise((r) => setTimeout(r, DEVICE_RETRY_MS));
        return loadDeviceId();
      }

      // Bắt đầu lấy mã ngay khi trang mở; các chỗ cần deviceId sẽ "await" promise này.
      let deviceIdPromise = loadDeviceId();

      async function getDeviceId() {
        return deviceIdPromise;
      }

      function formatDate(date) {
        if (!date) return "";
        const opts = {
          timeZone: "Asia/Ho_Chi_Minh",
          hour: "2-digit",
          minute: "2-digit",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour12: false,
        };
        const parts = new Intl.DateTimeFormat("vi-VN", opts).formatToParts(
          date,
        );
        const get = function (t) {
          const p = parts.find(function (x) {
            return x.type === t;
          });
          return p ? p.value : "";
        };
        return (
          get("hour") +
          ":" +
          get("minute") +
          " " +
          get("day") +
          "/" +
          get("month") +
          "/" +
          get("year")
        );
      }

      function extractRParam(text) {
        let m = text.match(/[?&]r=([^&\s]+)/i);
        if (m) return decodeURIComponent(m[1]);
        return null;
      }

      // Trả về {type:'direct', roomId} nếu lấy được room id ngay không cần server,
      // hoặc {type:'encrypted', r} nếu cần gọi API để giải mã,
      // hoặc null nếu không nhận diện được gì trong văn bản dán vào.
      function parseInput(text) {
        text = (text || "").trim();
        if (!text) return null;

        const rParam = extractRParam(text);
        if (rParam) return { type: "encrypted", r: rParam };

        let m = text.match(/room_id=(\d+)/i);
        if (m) return { type: "direct", roomId: m[1] };
        m = text.match(/\/live\/(\d+)/i);
        if (m) return { type: "direct", roomId: m[1] };
        if (/^\d{10,}$/.test(text)) return { type: "direct", roomId: text };

        // Chuỗi trông như đã mã hóa nhưng không nằm trong ?r=... -> vẫn thử gửi
        // thẳng lên server, vì server mới là nơi biết cách giải mã.
        if (/^[A-Za-z0-9_-]{16,}$/.test(text) && !/^\d+$/.test(text)) {
          return { type: "encrypted", r: text };
        }
        return null;
      }

      async function askServer(deviceId, r) {
        const ctrl = new AbortController();
        const timer = setTimeout(function () {
          ctrl.abort();
        }, API_TIMEOUT_MS);
        try {
          const url =
            API_URL +
            "?d=" +
            encodeURIComponent(deviceId) +
            "&r=" +
            encodeURIComponent(r) +
            "&t=" +
            Date.now();
          const res = await fetch(url, {
            method: "GET",
            cache: "no-store",
            signal: ctrl.signal,
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        } finally {
          clearTimeout(timer);
        }
      }

      let lastAutoOpened = null;

      function setBox(cls, html) {
        const box = document.getElementById("result");
        box.className = "result " + cls;
        box.innerHTML = html;
      }

      function buildOkResult(roomId) {
        const ssk = "snssdk1180://live?room_id=" + encodeURIComponent(roomId);
        const shareLink =
          "https://www.tiktok.com/share/live/" + encodeURIComponent(roomId);
        setBox(
          "ok",
          '<div class="label">Room ID</div><code>' +
            roomId +
            "</code>" +
            '<div class="label">Link SSK (mở app TikTok)</div>' +
            '<div class="row"><code id="sskLink">' +
            ssk +
            "</code>" +
            '<button class="copybtn" id="copySsk">COPY</button></div>' +
            '<div class="row"><a href="' +
            ssk +
            '" style="color:inherit">bấm để mở app</a></div>' +
            '<div class="label">Link share (tiktok.com/share/live)</div>' +
            '<div class="row"><code id="shareLinkEl">' +
            shareLink +
            "</code>" +
            '<button class="copybtn" id="copyShare">COPY</button></div>' +
            '<div class="row"><a href="' +
            shareLink +
            '" target="_blank" style="color:inherit">mở trong trình duyệt</a></div>',
        );

        function wireCopy(btnId, text) {
          document
            .getElementById(btnId)
            .addEventListener("click", async function () {
              try {
                await navigator.clipboard.writeText(text);
                this.textContent = "ĐÃ COPY";
                setTimeout(() => {
                  this.textContent = "COPY";
                }, 1200);
              } catch (e) {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.cssText = "position:fixed;opacity:0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                ta.remove();
              }
            });
        }
        wireCopy("copySsk", ssk);
        wireCopy("copyShare", shareLink);

        if (
          document.getElementById("autoOpen").checked &&
          roomId !== lastAutoOpened
        ) {
          lastAutoOpened = roomId;
          // Mở ngay, không setTimeout: sau các lần await gọi mạng (lấy deviceId,
          // gọi API xác minh), nhiều trình duyệt đã coi đây không còn là thao
          // tác trực tiếp của người dùng nữa nên có thể chặn việc tự mở
          // custom scheme — trễ thêm càng dễ bị chặn hơn.
          window.location.href = ssk;
        }
      }

      async function render() {
        const input = document.getElementById("input");
        const val = input.value;
        if (!val.trim()) return;

        const parsed = parseInput(val);
        if (!parsed) {
          setBox("err", "Không nhận diện được link. Kiểm tra lại link đã dán.");
          return;
        }

        if (parsed.type === "direct") {
          input.value = "";
          buildOkResult(parsed.roomId);
          return;
        }

        // type === 'encrypted' -> phải hỏi server, vì chỉ server mới biết cách
        // giải mã r và biết thiết bị này đã được duyệt hay chưa.
        input.disabled = true;
        setBox("loading", "Đang kiểm tra với máy chủ...");
        try {
          const deviceId = await getDeviceId();
          const data = await askServer(deviceId, parsed.r);

          if (data.status === "badlink") {
            setBox(
              "err",
              "Link không hợp lệ hoặc r= bị sai định dạng. Lấy link mới từ bot.",
            );
            return;
          }
          if (data.status === "blocked") {
            setBox(
              "warn",
              "Mở link quá nhanh, tạm bị chặn." +
                (data.untilMs
                  ? "<br>Mở lại sau: <strong>" +
                    formatDate(new Date(data.untilMs)) +
                    "</strong>"
                  : ""),
            );
            return;
          }
          if (data.status === "denied") {
            setBox(
              "err",
              'Thiết bị chưa được cấp phép.<div class="label">Mã thiết bị</div><code>' +
                deviceId +
                "</code><br>Gửi mã này cho bot/ctv để được duyệt.",
            );
            return;
          }
          if (data.status === "expired") {
            const expiry = data.expiryMs ? new Date(data.expiryMs) : null;
            setBox(
              "warn",
              "Thiết bị đã hết hạn." +
                (expiry
                  ? "<br>Hết hạn lúc: <strong>" +
                    formatDate(expiry) +
                    "</strong>"
                  : "") +
                "<br>Vui lòng liên hệ ctv để gia hạn.",
            );
            return;
          }
          if (data.status === "approved") {
            if (!data.roomId) {
              setBox(
                "err",
                "Server duyệt thiết bị nhưng không trả về room_id. Thử lại link khác.",
              );
              return;
            }
            input.value = "";
            buildOkResult(String(data.roomId));
            return;
          }
          setBox(
            "err",
            "Không thể kiểm tra: " +
              (data.msg || "phản hồi không xác định từ server."),
          );
        } catch (e) {
          setBox("err", "Lỗi kết nối tới máy chủ. Kiểm tra mạng rồi thử lại.");
        } finally {
          input.disabled = false;
        }
      }

      document.getElementById("deviceIdShown").textContent = "Đang lấy mã...";
      getDeviceId().then(function (id) {
        document.getElementById("deviceIdShown").textContent = id;

        const expiryMs = Number(localStorage.getItem("tnam_device_expiry"));
        const badge = document.getElementById("deviceExpiryShown");
        if (expiryMs) {
          badge.textContent = "Hạn dùng: " + formatDate(new Date(expiryMs));
        } else {
          badge.textContent = "";
        }
      });

      // Không còn nút bấm: dán vào ô input là tự chạy.
      // Dùng debounce (chờ người dùng ngừng gõ/dán 400ms) để không gọi API
      // liên tục theo từng ký tự, nhưng vẫn tự động hoàn toàn, không cần bấm gì.
      let debounceTimer = null;
      function scheduleRender() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(render, 400);
      }
      document
        .getElementById("input")
        .addEventListener("input", scheduleRender);
      document.getElementById("input").addEventListener("paste", function () {
        clearTimeout(debounceTimer);
        setTimeout(render, 50);
      });
      document
        .getElementById("input")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
            clearTimeout(debounceTimer);
            render();
          }
        });
    </script>
  </body>
</html>
